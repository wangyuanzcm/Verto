server:
  port: 8080
  undertow:
    decode-url: true # 鍚敤URL瑙ｇ爜
    # max-http-post-size: 10MB # 骞虫浛 tomcat server.tomcat.max-swallow-size锛寀ndertow璇ュ€奸粯璁や负-1
    worker-threads: 16  # 4鏍窩PU鏍囧噯閰嶇疆
    buffers:
      websocket: 8192 # WebSocket缂撳啿 浠ュ瓧鑺備负鍗曚綅锛岃繖閲岃缃负8 KB
      io: 16384 # IO鎿嶄綔缂撳啿 浠ュ瓧鑺備负鍗曚綅锛岃繖閲岃缃负16 KB
  error:
    include-exception: true
    include-stacktrace: ALWAYS
    include-message: ALWAYS
  servlet:
    context-path: /verto-api
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/javascript,application/json,application/xml,text/html,text/xml,text/plain,text/css,image/*

management:
  endpoints:
    web:
      exposure:
        include: metrics,httpexchanges

spring:
  application:
    name: verto-api-server
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  #json 鏃堕棿鎴崇粺涓€杞崲
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  jpa:
    open-in-view: false
  aop:
    proxy-target-class: true
  # 璁剧疆闈欐€佹枃浠惰矾寰勶紝js,css?  mvc:
    static-path-pattern: /**
    #Spring Boot 2.6+鍚庢槧灏勫尮閰嶇殑榛樿绛栫暐宸蹭粠AntPathMatcher鏇存敼涓篜athPatternParser,闇€瑕佹墜鍔ㄦ寚瀹氫负ant-path-matcher
    pathmatch:
      matching-strategy: ant_path_matcher
  resource:
    static-locations: classpath:/static/,classpath:/public/
  # 鏁版嵁婧愰厤?  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/verto_api?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: 123456
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      pool-name: DatebookHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  # Redis閰嶇疆
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 10000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

# MyBatis Plus閰嶇疆
mybatis-plus:
  mapper-locations: classpath*:mapper/*Mapper.xml
  type-aliases-package: com.verto.vertomanagement.entity
  global-config:
    banner: false
    db-config:
      id-type: ASSIGN_ID
      table-underline: true
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'

# 鏃ュ織閰嶇疆
logging:
  level:
    com.verto.vertomanagement: debug
    org.springframework.web: info
    org.springframework.security: debug
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'

# 搴旂敤閰嶇疆
app:
  # JWT閰嶇疆
  jwt:
    secret: staff-management-jwt-secret-key-2024
    expiration: 86400000 # 24灏忔椂
  # 楠岃瘉鐮侀厤?  captcha:
    enabled: true
    length: 4
    expire: 300 # 5鍒嗛挓
  # 鏂囦欢涓婁紶閰嶇疆
  upload:
    path: ./uploads/
    max-size: 10MB
