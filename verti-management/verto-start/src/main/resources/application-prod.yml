# 生产环境配置
spring:
  # 数据源配?  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/verto_api?characterEncoding=UTF-8&useUnicode=true&useSSL=true&tinyInt1isBit=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:root}
      # 连接池配?      initial-size: 10
      min-idle: 10
      max-active: 50
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      # 监控配置
      filters: stat,slf4j
      stat-view-servlet:
        enabled: false # 生产环境关闭监控页面
  
  # Redis配置
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 10000ms
    lettuce:
      pool:
        max-active: 20
        max-wait: -1ms
        max-idle: 10
        min-idle: 5

# 日志配置
logging:
  level:
    root: warn
    com.verto.vertomanagement: info
  file:
    name: logs/staff-management.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 90

# 应用配置
app:
  # JWT配置
  jwt:
    secret: ${JWT_SECRET:staff-management-jwt-secret-key-production-2024}
    expiration: 86400000 # 24小时
  # 验证码配?  captcha:
    enabled: true
    length: 4
    expire: 300 # 5分钟
  # 文件上传配置
  upload:
    path: ${UPLOAD_PATH:/data/uploads/}
    max-size: 10MB
